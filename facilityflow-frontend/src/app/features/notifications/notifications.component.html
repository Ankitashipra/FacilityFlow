<ff-page-header title="Notifications" subtitle="Updates on tickets, reservations, and system events."></ff-page-header>

@if (loading()) {
  <div class="table-skeleton"></div>
} @else {
  @if (page(); as p) {
  @if (p.content.length === 0) {
    <ff-empty-state icon="🔔" title="You're all caught up" description="New ticket and reservation updates will show up here."></ff-empty-state>
  } @else {
    <div class="notification-list">
      @for (n of p.content; track n.id) {
        <div class="notification-item" [class.notification-item--unread]="!n.read" (click)="markRead(n)">
          <span class="notification-item__icon">{{ icon(n.type) }}</span>
          <div class="notification-item__body">
            <div class="notification-item__title">{{ n.title }}</div>
            <div class="notification-item__message">{{ n.message }}</div>
            <div class="notification-item__time">{{ n.createdAt | date: 'MMM d, y, h:mm a' }}</div>
          </div>
          @if (!n.read) { <span class="unread-dot"></span> }
        </div>
      }
    </div>

    <ff-pagination [pageNumber]="p.pageNumber" [totalPages]="p.totalPages" [totalElements]="p.totalElements" [last]="p.last" (pageChange)="load($event)"></ff-pagination>
  }
  }
}
